<style>
  .hiot-nav {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 16px;

    top: 0;
    z-index: 100;
    min-height: 44px;

    letter-spacing: .06em;
    color: #fff;
    text-decoration: none;
    margin-right: 12px;
    white-space: nowrap;
  }
  .hiot-nav-brand:hover { color: #5794f2; }
  .hiot-nav-items {
    display: flex;
    align-items: center;
    gap: 2px;
    flex: 1;
    flex-wrap: wrap;
  }
  .hiot-nav-link,
  .hiot-nav-trigger {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 10px 12px;
    font-size: .78rem;
    font-weight: 500;
    letter-spacing: .03em;
    color: #a0a4b0;
    text-decoration: none;
    border: none;
    background: none;
    cursor: pointer;
    border-radius: 4px;
    white-space: nowrap;
    transition: color .15s, background .15s;
    font-family: inherit;
  }
  .hiot-nav-link:hover,
  .hiot-nav-trigger:hover,
  .hiot-nav-item:hover .hiot-nav-trigger {
    color: #fff;
    background: rgba(87, 148, 242, .1);
  }
  .hiot-nav-link.active,
  .hiot-nav-trigger.active {
    color: #5794f2;
    background: rgba(87, 148, 242, .12);
  }
  .hiot-nav-caret {
    font-size: .55rem;
    opacity: .7;
    margin-top: 1px;
  }
  .hiot-nav-item {
    position: relative;
  }
  .hiot-nav-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 200px;
    padding: 6px;
    background: #181b1f;
    border: 1px solid #2d3038;
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
  }
  .hiot-nav-item:hover .hiot-nav-dropdown,
  .hiot-nav-item:focus-within .hiot-nav-dropdown {
    display: block;
  }
  .hiot-nav-dropdown a {
    display: block;
    padding: 8px 12px;
    font-size: .78rem;
    color: #a0a4b0;
    text-decoration: none;
    border-radius: 4px;
    transition: color .15s, background .15s;
  }
  .hiot-nav-dropdown a:hover {
    color: #fff;
    background: rgba(87, 148, 242, .12);
  }
  .hiot-nav-dropdown a.active { color: #5794f2; }
  .hiot-nav-dropdown-desc {
    display: block;
    font-size: .65rem;
    color: #6c7080;
    margin-top: 2px;
    line-height: 1.3;
  }
  .hiot-nav-page {
    margin-left: auto;
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .04em;
    color: #6c7080;
    white-space: nowrap;
    padding: 10px 0;
  }

<nav class="hiot-nav">
  <a class="hiot-nav-brand" href="/">HomeIot</a>

      <span class="hiot-nav-trigger{{ACTIVE_DASHBOARDS}}">Dashboards <span class="hiot-nav-caret">▾</span></span>
      <div class="hiot-nav-dropdown">
        <a href="/dashboard/" class="{{ACTIVE_DASHBOARD}}">
          Température extérieur
          <span class="hiot-nav-dropdown-desc">X-Sense SAAS et VMC Tout</span>
        </a>
      </div>
    </div>
    <a class="hiot-nav-link{{ACTIVE_VMC}}" href="/vmc/">VMC</a>
    <div class="hiot-nav-item">
      <span class="hiot-nav-trigger{{ACTIVE_CAPTEURS}}">Capteurs <span class="hiot-nav-caret">▾</span></span>
      <div class="hiot-nav-dropdown">
        <a href="/capteurs/#zigbee" class="{{ACTIVE_CAPTEURS_ZIGBEE}}">
          Zigbee
          <span class="hiot-nav-dropdown-desc">Capteurs et actionneurs via zigbee2mqtt</span>
        </a>
        <a href="/capteurs/#lora" class="{{ACTIVE_CAPTEURS_LORA}}">
          LoRa
          <span class="hiot-nav-dropdown-desc">X-Sense — fumée et thermo-hygromètres</span>
        </a>
      </div>
    </div>
    <div class="hiot-nav-item">
      <span class="hiot-nav-trigger{{ACTIVE_INFRA}}">Infrastructure <span class="hiot-nav-caret">▾</span></span>
      <div class="hiot-nav-dropdown">
        <a class="hiot-nav-external" href="http://localhost:8001/" target="_blank" rel="noopener noreferrer" data-port="8001">
          Zigbee2MQTT
          <span class="hiot-nav-dropdown-desc">Appairage, carte réseau et journaux</span>
        </a>
        <a class="hiot-nav-external" href="http://localhost:3000/" target="_blank" rel="noopener noreferrer" data-port="3000">
          Grafana
          <span class="hiot-nav-dropdown-desc">Visualisation et commandes VMC</span>
        </a>
      </div>
    </div>
  </div>
  <span class="hiot-nav-page">{{PAGE_TITLE}}</span>
</nav>
<script>
  document.querySelectorAll('.hiot-nav-external[data-port]').forEach(function (el) {
    el.href = location.protocol + '//' + location.hostname + ':' + el.dataset.port + '/';
  });
</script>
